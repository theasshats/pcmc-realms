# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true

# Project
group=com.theasshats.pcmcrealms
mod_version=0.1.0

# Mod properties
mod_id=pcmc_realms
mod_name=PCMC Realms
mod_license=MIT
mod_authors=theasshats
mod_description=Government layer (Part 2) for Project Commonwealth governance: tiers, federation hierarchy, and a pluggable law engine with three enforcement modes (AUTOMATIC/OFFICER/SOCIAL). Layers political state on top of pcmc-territory's claim-resolution substrate; soft-law enforcement drives MineColonies guard aggro. Owns no claims and no coin.

# Minecraft / NeoForge (must match pcmc-territory)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Java toolchain
java_version=21

# Hard dependency: pcmc-territory (Part 1) — the claim-resolution substrate this mod governs.
# Compiled against the :stubs mirror of its api package until Part 1 publishes a consumable
# artifact (see build.gradle / stubs/README.md). The runtime mod id and version range below
# go into neoforge.mods.toml as a REQUIRED dependency.
pcmc_territory_mod_id=pcmc_territory
pcmc_territory_version_range=[0.1.0,)

# Soft dependency: MineColonies (guard enforcement, §5) — compile-only; the mod degrades to
# the decoupled "wanted" signal with no guard teeth when MineColonies is absent.
# CurseForge project 245506 / file 8186694 (1.1.1327-1.21.1-snapshot), matching pcmc-territory.
minecolonies_curse_project=245506
minecolonies_curse_file=8186694
minecolonies_version_range=[1.1.1327,)
