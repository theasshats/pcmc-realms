plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

base {
    archivesName = project.mod_id
}

version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

repositories {
    mavenCentral()
    // MineColonies (CurseForge mirror via CurseMaven) — soft dep for guard enforcement (§5).
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

neoForge {
    version = project.neo_version

    // Run configs for local testing (not usable in this sandbox; built/playtested elsewhere).
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // The pure government engine — bundled into the mod jar (see the jar task below).
    implementation project(':core')

    // --- Hard dependency: pcmc-territory (Part 1) ---
    // Compiled against the :stubs mirror of its public api package because Part 1 has no published
    // artifact yet. NOT bundled (compileOnly) — the real pcmc_territory mod, a `required` dependency
    // in neoforge.mods.toml, supplies these classes at runtime. Swap for the real coordinate once
    // Part 1 releases (see stubs/README.md).
    compileOnly project(':stubs')

    // --- Soft dependency: MineColonies (guard enforcement, §5) — compile-only ---
    // 1.1.1327-1.21.1-snapshot, CurseForge project 245506 / file 8186694 (matches pcmc-territory).
    compileOnly "curse.maven:minecolonies-${minecolonies_curse_project}:${minecolonies_curse_file}"
}

// :core is a plain Java library; bundle its classes into the mod jar so servers don't install it
// separately. :stubs is deliberately NOT bundled (the real pcmc_territory provides those classes).
jar {
    from(project(':core').sourceSets.main.output)
}

// neoforge.mods.toml in src/main/resources is a template: FML rejects a jar whose metadata still
// contains literal ${...} placeholders. Expand them at processResources time (mirrors pcmc-territory,
// whose first playtest caught exactly this). CI re-validates the packaged metadata.
var metadataProperties = [
        loader_version_range        : loader_version_range,
        mod_license                 : mod_license,
        mod_id                      : mod_id,
        mod_version                 : mod_version,
        mod_name                    : mod_name,
        mod_authors                 : mod_authors,
        mod_description             : mod_description,
        neo_version_range           : neo_version_range,
        minecraft_version_range     : minecraft_version_range,
        pcmc_territory_mod_id       : pcmc_territory_mod_id,
        pcmc_territory_version_range: pcmc_territory_version_range,
        minecolonies_version_range  : minecolonies_version_range,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
}

tasks.named('compileJava').configure {
    dependsOn ':core:classes'
}
